name: Publier le site

# Publie le site sur GitHub Pages.
#
# Déclenchement manuel uniquement, tant que Pages n'est pas activé : GitHub
# refuse qu'un workflow crée le site lui-même, il faut d'abord aller une fois
# dans Settings → Pages → Source : GitHub Actions.
#
# Une fois Pages activé, on peut publier à chaque envoi en ajoutant :
#   push:
#     branches: [claude/stories-gallery-site-4zdcps]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Envoyer le site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Déployer
        id: deploiement
        uses: actions/deploy-pages@v4
