<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Les histoires de Livia</title>
<meta name="description" content="La bibliothèque des histoires du soir de Livia : Peppa Pig, La Reine des Neiges… en bandes dessinées.">
<meta name="theme-color" content="#1a1030">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Histoires de Livia">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E📖%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="grain-layer" aria-hidden="true"></div>

<header class="topbar">
  <button class="logo" id="btnLogo" aria-label="Retour à l'accueil">
    <span class="logo-mark" id="logoMark"></span>
    <span class="logo-txt"><b>KID</b><i>CARTOON</i></span>
  </button>
  <button class="icon-btn" id="btnRandom" aria-label="Histoire au hasard">🎲</button>
</header>

<nav class="mainnav" id="mainnav" aria-label="Rubriques">
  <button data-nav="histoires">📖 Histoires</button>
  <button data-nav="jeux">🎮 Jeux</button>
</nav>

<nav class="tabs" id="tabs" aria-label="Univers"></nav>

<main id="main">

  <!-- LA UNE -->
  <section class="cover" id="viewCover">
    <div class="cover-sheet">
      <div class="cover-head">
        <div class="cover-logo"><span class="logo-mark" id="coverMark"></span><span>KID CARTOON</span></div>
        <h1>Les histoires de <b>Livia</b></h1>
        <div class="cover-meta" id="coverMeta"></div>
        <nav class="cover-nav" id="coverNav" aria-label="Rubriques">
          <button data-nav="histoires">📖 Histoires</button>
          <button data-nav="jeux">🎮 Jeux</button>
        </nav>
      </div>
      <div class="cover-art" id="coverArt">
        <div class="cover-sticker" id="coverSticker"></div>
      </div>
      <div class="cover-foot">
        <button class="cover-random" id="btnCoverRandom">🎲 Une histoire au hasard</button>
      </div>
    </div>
  </section>

  <!-- SOMMAIRE : les univers -->
  <section class="view" id="viewHome">
    <p class="hello">Choisis un univers, puis fais défiler les histoires.</p>
    <div class="uni-grid" id="uniGrid"></div>
    <p class="foot-note">Créé à la maison, pour l'heure du coucher.</p>
  </section>

  <!-- UNIVERS : cover flow -->
  <section class="view" id="viewUniverse" hidden>
    <div class="uni-head">
      <h2 id="uniTitle"></h2>
      <p id="uniTagline"></p>
    </div>

    <div class="cf-stage">
      <div class="cf" id="cf" tabindex="0" role="listbox" aria-label="Histoires"></div>
    </div>

    <div class="cf-meta">
      <div class="cf-tags" id="cfTags"></div>
      <h3 id="cfTitle"></h3>
      <p id="cfSubtitle"></p>
      <button class="cta" id="btnRead">Lire l'histoire</button>
    </div>

    <div class="cf-dots" id="cfDots"></div>
  </section>

  <!-- LES JEUX -->
  <section class="view" id="viewGames" hidden>
    <div class="uni-head">
      <h2>🎮 Les jeux de Livia</h2>
      <p id="gamesSub">Pour jouer tout seul, dès 3 ans</p>
    </div>
    <div class="jeux-grid" id="gamesGrid"></div>
    <div class="jeu-stage" id="gameStage" hidden></div>
  </section>
</main>

<!-- LECTEUR DE BD -->
<div class="reader" id="reader" hidden>
  <div class="reader-top">
    <button class="rbtn" id="rClose" aria-label="Fermer">✕</button>
    <div class="reader-title" id="rTitle"></div>
    <button class="rbtn" id="rSpeak" aria-label="Lire à voix haute">🔊</button>
  </div>
  <div class="pages" id="pages"></div>
  <div class="reader-bottom">
    <button class="rnav" id="rPrev" aria-label="Page précédente">‹</button>
    <div class="rdots" id="rDots"></div>
    <button class="rnav" id="rNext" aria-label="Page suivante">›</button>
  </div>
</div>

<script src="assets/js/art.js"></script>
<script src="assets/js/stories.js"></script>
<script src="assets/js/games.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
