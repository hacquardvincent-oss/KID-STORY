:root {
  --ink: #2a1c33;
  --bg-1: #1a1030;
  --bg-2: #2c1a4a;
  --bg-3: #3d2159;
  --cream: #fff6ec;
  --cream-dim: rgba(255, 246, 236, .66);
  --accent: #ff6fa5;
  --accent-2: #ffd166;
  --panel: #ffffff;
  --radius: 22px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/* `hidden` doit toujours l'emporter sur nos display: flex / grid */
[hidden] { display: none !important; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: 'Fredoka', 'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  color: var(--cream);
  background:
    radial-gradient(120% 80% at 50% -10%, var(--bg-3) 0%, transparent 60%),
    linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-1) 100%);
  background-attachment: fixed;
  min-height: 100%;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}

/* ciel étoilé discret */
.stars-layer {
  position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .55;
  background-image:
    radial-gradient(1.6px 1.6px at 12% 14%, #fff, transparent),
    radial-gradient(1.4px 1.4px at 78% 9%, #fff, transparent),
    radial-gradient(1.8px 1.8px at 33% 26%, #ffe9a8, transparent),
    radial-gradient(1.3px 1.3px at 62% 34%, #fff, transparent),
    radial-gradient(1.5px 1.5px at 89% 47%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 20% 58%, #ffd9ec, transparent),
    radial-gradient(1.6px 1.6px at 51% 72%, #fff, transparent),
    radial-gradient(1.3px 1.3px at 8% 82%, #fff, transparent),
    radial-gradient(1.4px 1.4px at 71% 88%, #ffe9a8, transparent);
}

main, .topbar, .tabs { position: relative; z-index: 1; }

/* ---------------- barre du haut ---------------- */
.topbar {
  display: flex; align-items: center; gap: 10px;
  padding: calc(var(--safe-top) + 12px) 14px 8px;
}
.brand { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
.brand-moon { font-size: 22px; filter: drop-shadow(0 2px 6px rgba(255, 209, 102, .5)); }
.brand-txt {
  font-size: 19px; letter-spacing: .2px; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis; font-weight: 500;
}
.brand-txt b { font-weight: 700; color: var(--accent-2); }

.icon-btn {
  flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid rgba(255, 246, 236, .18);
  background: rgba(255, 246, 236, .08); color: var(--cream);
  font-size: 20px; line-height: 1; cursor: pointer;
  display: grid; place-items: center; font-family: inherit;
  transition: transform .15s, background .15s;
}
.icon-btn:active { transform: scale(.9); background: rgba(255, 246, 236, .18); }
#btnBack { font-size: 30px; padding-bottom: 4px; }

/* ---------------- onglets univers ---------------- */
.tabs {
  display: flex; gap: 8px; overflow-x: auto; padding: 6px 14px 12px;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 auto; border: 1px solid rgba(255, 246, 236, .16);
  background: rgba(255, 246, 236, .07); color: var(--cream-dim);
  border-radius: 999px; padding: 8px 15px; font-size: 14.5px;
  font-family: inherit; cursor: pointer; white-space: nowrap;
  transition: .18s;
}
.tab.is-active {
  color: #2a1c33; font-weight: 600; border-color: transparent;
  background: linear-gradient(135deg, var(--tc1, #ff6fa5), var(--tc2, #ffd166));
  box-shadow: 0 6px 18px -8px var(--tc1, #ff6fa5);
}

/* ---------------- accueil ---------------- */
.view { padding: 0 14px 40px; }
.hello { margin: 2px 4px 16px; color: var(--cream-dim); font-size: 15px; }

.uni-grid { display: grid; gap: 14px; }
.uni-card {
  position: relative; display: block; width: 100%; padding: 0;
  border: 0; border-radius: var(--radius); overflow: hidden; cursor: pointer;
  background: #10; text-align: left; font-family: inherit; color: var(--cream);
  box-shadow: 0 16px 34px -20px rgba(0, 0, 0, .9);
  transition: transform .18s;
}
.uni-card:active { transform: scale(.985); }
.uni-card .thumb { display: block; aspect-ratio: 16 / 9; }
.uni-card .thumb svg { display: block; width: 100%; height: 100%; }
.uni-card .cap {
  position: absolute; inset: auto 0 0 0; padding: 30px 16px 14px;
  background: linear-gradient(180deg, transparent, rgba(20, 10, 35, .92) 62%);
  display: flex; align-items: flex-end; gap: 10px;
}
.uni-card .cap h3 { margin: 0; font-size: 19px; font-weight: 600; }
.uni-card .cap p { margin: 2px 0 0; font-size: 13px; color: var(--cream-dim); }
.uni-card .pill {
  margin-left: auto; flex: 0 0 auto; align-self: center;
  background: rgba(255, 246, 236, .14); border-radius: 999px;
  padding: 5px 11px; font-size: 12.5px; white-space: nowrap;
}
.foot-note { margin: 26px 4px 0; font-size: 12.5px; color: rgba(255, 246, 236, .38); }

/* ---------------- entête univers ---------------- */
.uni-head { text-align: center; margin: 0 0 6px; }
.uni-head h2 { margin: 0; font-size: 24px; font-weight: 600; }
.uni-head p { margin: 3px 0 0; font-size: 14px; color: var(--cream-dim); }

/* ---------------- COVER FLOW ---------------- */
.cf-stage {
  position: relative;
  height: min(58vh, 340px);
  margin: 8px -14px 0;
  perspective: 1000px;
  perspective-origin: 50% 44%;
  overflow: hidden;
  touch-action: pan-y;
}
.cf {
  position: absolute; inset: 0;
  transform-style: preserve-3d;
  outline: none;
}
.cf-item {
  position: absolute;
  top: 50%; left: 50%;
  width: min(46vw, 200px);
  aspect-ratio: 1 / 1;
  margin: calc(min(46vw, 200px) / -2 * 1.16) 0 0 calc(min(46vw, 200px) / -2);
  border-radius: 14px;
  overflow: visible;
  cursor: pointer;
  will-change: transform;
  transition: transform .42s cubic-bezier(.22, .68, .3, 1);
  transform-style: preserve-3d;
}
.cf.is-dragging .cf-item { transition: none; }

.cf-art {
  position: relative; width: 100%; height: 100%;
  border-radius: 14px; overflow: hidden;
  background: #10091f;
  border: 2px solid rgba(255, 246, 236, .3);
  box-shadow: 0 18px 30px -18px rgba(0, 0, 0, .95);
}
.cf-art svg { display: block; width: 100%; height: 100%; }
.cf-art::after {
  content: ''; position: absolute; inset: 0; border-radius: 12px;
  background: linear-gradient(115deg, rgba(255, 255, 255, .34) 0%, rgba(255, 255, 255, .05) 34%, transparent 56%);
  pointer-events: none;
}
.cf-item .cf-shade {
  position: absolute; inset: 0; border-radius: 14px; pointer-events: none;
  background: rgba(12, 6, 24, .5); opacity: 0;
  transition: opacity .42s;
}
.cf-item.is-current .cf-shade { opacity: 0; }

/* reflet iPod */
.cf-reflect {
  position: absolute; top: 100%; left: 0; width: 100%; height: 70%;
  border-radius: 14px; overflow: hidden;
  transform: scaleY(-1); transform-origin: top;
  margin-top: 4px; opacity: .42; pointer-events: none;
  -webkit-mask-image: linear-gradient(to top, rgba(0, 0, 0, .95), transparent 82%);
  mask-image: linear-gradient(to top, rgba(0, 0, 0, .95), transparent 82%);
}
.cf-reflect svg { display: block; width: 100%; height: 143%; }

.cf-badge {
  position: absolute; top: 7px; right: 7px; z-index: 2;
  background: rgba(20, 10, 35, .82); color: #fff;
  font-size: 11px; padding: 3px 8px; border-radius: 999px;
  border: 1px solid rgba(255, 246, 236, .25);
}

/* ---------------- infos histoire ---------------- */
.cf-meta { text-align: center; margin-top: 6px; }
.cf-tags { display: flex; gap: 6px; justify-content: center; min-height: 22px; }
.cf-tags span {
  font-size: 11.5px; padding: 3px 10px; border-radius: 999px;
  background: rgba(255, 246, 236, .1); border: 1px solid rgba(255, 246, 236, .16);
  color: var(--cream-dim);
}
.cf-meta h3 {
  margin: 8px 0 0; font-size: 21px; font-weight: 600; line-height: 1.2;
  min-height: 25px;
}
.cf-meta p { margin: 3px 0 0; font-size: 14px; color: var(--cream-dim); min-height: 18px; }

.cta {
  margin-top: 14px; border: 0; cursor: pointer; font-family: inherit;
  padding: 13px 30px; border-radius: 999px; font-size: 16.5px; font-weight: 600;
  color: #2a1c33;
  background: linear-gradient(135deg, var(--tc1, #ff6fa5), var(--tc2, #ffd166));
  box-shadow: 0 12px 26px -12px var(--tc1, #ff6fa5);
  transition: transform .15s;
}
.cta:active { transform: scale(.96); }

.cf-dots { display: flex; gap: 6px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
.cf-dots i {
  width: 7px; height: 7px; border-radius: 50%; background: rgba(255, 246, 236, .26);
  transition: .2s;
}
.cf-dots i.on { background: var(--tc2, #ffd166); transform: scale(1.35); }

/* ---------------- LECTEUR ---------------- */
.reader {
  position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
  background-color: #1a1030;
  background-image:

/* ============================================================
   app.js — navigation, Cover Flow infini et lecteur de BD
   ============================================================ */
(function () {

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var STORE = 'livia.v1.';

  /* ---------------- petites aides ---------------- */
  function store(k, v) {
    try {
      if (v === undefined) return localStorage.getItem(STORE + k);
      localStorage.setItem(STORE + k, v);
    } catch (e) { /* mode privé : on ignore */ }
    return null;
  }
  function findUniverse(id) {
    for (var i = 0; i < UNIVERSES.length; i++) if (UNIVERSES[i].id === id) return UNIVERSES[i];
    return null;
  }
  function findStory(u, id) {
    for (var i = 0; i < u.stories.length; i++) if (u.stories[i].id === id) return u.stories[i];
    return null;
  }
  function isRead(u, s) { return store('read.' + u.id + '.' + s.id) === '1'; }

  function setTheme(u) {
    var r = document.documentElement.style;
    r.setProperty('--tc1', u ? u.c1 : '#ff6fa5');
    r.setProperty('--tc2', u ? u.c2 : '#ffd166');
    var m = document.querySelector('meta[name=theme-color]');
    if (m) m.setAttribute('content', '#1a1030');
  }

  /* ============================================================
     COVER FLOW — défilement 3D infini, style iPod
     ============================================================ */
  function CoverFlow(el, opts) {
    this.el = el;
    this.onChange = opts.onChange || function () { };
    this.onOpen = opts.onOpen || function () { };
    this.items = [];
    this.nodes = [];
    this.pos = 0;
    this.dragging = false;
    this.bind();
  }

  CoverFlow.prototype.setItems = function (items, start) {
    var self = this;
    this.items = items;
    this.el.innerHTML = '';
    this.nodes = items.map(function (it, i) {
      var n = document.createElement('div');
      n.className = 'cf-item';
      n.setAttribute('role', 'option');
      n.setAttribute('aria-label', it.label);
      var svg = Art.scene(it.scene, { slice: true, noBubbles: true });
      n.innerHTML =
        '<div class="cf-art">' + svg + (it.badge ? '<div class="cf-badge">' + it.badge + '</div>' : '') +
        '<div class="cf-shade"></div></div>' +
        '<div class="cf-reflect">' + svg + '</div>';
      n.addEventListener('click', function () {
        if (self.moved) return;
        var d = self.delta(i);
        if (Math.abs(d) < .5) self.onOpen(i); else self.go(self.pos + d);
      });
      self.el.appendChild(n);
      return n;
    });
    this.pos = start || 0;
    this.layout();
    this.onChange(this.current());
  };

  CoverFlow.prototype.n = function () { return this.items.length; };

  /* écart circulaire le plus court entre l'item i et la position courante */
  CoverFlow.prototype.delta = function (i) {
    var n = this.n();
    if (!n) return 0;
    var d = (i - this.pos) % n;
    if (d > n / 2) d -= n;
    if (d < -n / 2) d += n;
    return d;
  };

  CoverFlow.prototype.current = function () {
    var n = this.n();
    if (!n) return -1;
    return ((Math.round(this.pos) % n) + n) % n;
  };

  CoverFlow.prototype.layout = function () {
    var iw = this.nodes.length ? this.nodes[0].offsetWidth : 200;
    if (!iw) iw = 200;
    for (var i = 0; i < this.nodes.length; i++) {
      var d = this.delta(i);
      var a = Math.abs(d);
      var node = this.nodes[i];
      if (a > 3.4) { node.style.visibility = 'hidden'; continue; }
      node.style.visibility = 'visible';
      var sg = d < 0 ? -1 : 1;
      var k = Math.min(a, 1);
      var x = sg * (k * iw * 0.58 + Math.max(0, a - 1) * iw * 0.30);
      var z = 40 - a * 95;
      var ry = -sg * 60 * k;
      var sc = 1.06 - 0.15 * k;
      node.style.transform = 'translate3d(' + x.toFixed(1) + 'px,0,' + z.toFixed(1) + 'px) ' +
        'rotateY(' + ry.toFixed(1) + 'deg) scale(' + sc.toFixed(3) + ')';
      node.style.zIndex = String(1000 - Math.round(a * 100));
      node.style.opacity = a > 2.6 ? String(Math.max(0, (3.4 - a) / .8)) : '1';
      var sh = node.querySelector('.cf-shade');
      if (sh) sh.style.opacity = String(Math.min(.55, k * .42));
      node.classList.toggle('is-current', a < .5);
    }
  };

  CoverFlow.prototype.go = function (p, silent) {
    var n = this.n();
    if (!n) return;
    this.pos = p;
    this.layout();
    var self = this;
    // on renormalise : les écarts sont circulaires, l'affichage ne bouge pas
    setTimeout(function () { self.pos = ((self.pos % n) + n) % n; }, 450);
    if (!silent) this.onChange(this.current());
  };

  CoverFlow.prototype.step = function (dir) { this.go(Math.round(this.pos) + dir); };

  CoverFlow.prototype.setBadge = function (i, txt) {
    var b = this.nodes[i] && this.nodes[i].querySelector('.cf-badge');
    if (b) b.textContent = txt;
  };

  CoverFlow.prototype.bind = function () {
    var self = this, startX = 0, startPos = 0, lastX = 0, lastT = 0, vel = 0, id = null;

    function down(e) {
      if (!self.n()) return;
      id = e.pointerId;
      self.dragging = true; self.moved = false;
      startX = lastX = e.clientX; startPos = self.pos; vel = 0; lastT = e.timeStamp;
      self.el.classList.add('is-dragging');
      try { self.el.setPointerCapture(id); } catch (err) { }
    }
    function move(e) {
      if (!self.dragging || e.pointerId !== id) return;
      var iw = self.nodes[0] ? self.nodes[0].offsetWidth : 200;
      var dx = e.clientX - startX;
      if (Math.abs(dx) > 6) self.moved = true;
      var dt = Math.max(1, e.timeStamp - lastT);
      vel = (e.clientX - lastX) / dt;
      lastX = e.clientX; lastT = e.timeStamp;
      self.pos = startPos - dx / (iw * 0.62);
      self.layout();
    }
    function up(e) {
      if (!self.dragging) return;
      self.dragging = false;
      self.el.classList.remove('is-dragging');
      try { self.el.releasePointerCapture(id); } catch (err) { }
      var fling = Math.max(-2, Math.min(2, Math.round(-vel * 2.4)));
      self.go(Math.round(self.pos + fling));
      setTimeout(function () { self.moved = false; }, 40);
    }

    this.el.addEventListener('pointerdown', down);
    this.el.addEventListener('pointermove', move);
    this.el.addEventListener('pointerup', up);
    this.el.addEventListener('pointercancel', up);

    var wheelLock = 0;
    this.el.addEventListener('wheel', function (e) {
      var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
      if (Math.abs(d) < 4) return;
      e.preventDefault();
      var now = Date.now();
      if (now - wheelLock < 220) return;
      wheelLock = now;
      self.step(d > 0 ? 1 : -1);
    }, { passive: false });

    this.el.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') { e.preventDefault(); self.step(1); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); self.step(-1); }
      else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); self.onOpen(self.current()); }
    });

  };

  /* ============================================================

     ============================================================ */
  var els = {
    tabs: $('#tabs'), home: $('#viewHome'), uni: $('#viewUniverse'),
    grid: $('#uniGrid'), back: $('#btnBack'), random: $('#btnRandom'),
    uniTitle: $('#uniTitle'), uniTagline: $('#uniTagline'),
    cf: $('#cf'), cfTitle: $('#cfTitle'), cfSub: $('#cfSubtitle'),

    reader: $('#reader'), pages: $('#pages'), rTitle: $('#rTitle'),
    rDots: $('#rDots'), rPrev: $('#rPrev'), rNext: $('#rNext'),
    rClose: $('#rClose'), rSpeak: $('#rSpeak')
  };

  var flow = new CoverFlow(els.cf, {

  var state = { universe: null, story: null, page: 0, speak: false };

  /* ---------------- onglets ---------------- */
  function renderTabs(activeId) {
    els.tabs.innerHTML = '';
    var all = document.createElement('button');
    all.className = 'tab' + (activeId ? '' : ' is-active');
    all.textContent = '★ Tout';

    UNIVERSES.forEach(function (u) {
      var b = document.createElement('button');

      els.tabs.appendChild(b);
    });
  }

  /* ---------------- accueil ---------------- */
  function renderHome() {
    els.grid.innerHTML = '';
    UNIVERSES.forEach(function (u) {
      var card = document.createElement('button');
      card.className = 'uni-card';
      var n = u.stories.length;
      card.innerHTML =
        '<div class="thumb">' + Art.scene(u.cover, { slice: true, noBubbles: true }) + '</div>' +
        '<div class="cap"><div><h3>' + u.emoji + ' ' + u.name + '</h3><p>' + u.tagline + '</p></div>' +
        '<span class="pill">' + n + ' histoire' + (n > 1 ? 's' : '') + '</span></div>';
      card.onclick = function () { location.hash = '#/u/' + u.id; };

    });
  }

  /* ---------------- univers ---------------- */
  function renderUniverse(u, startId) {
    state.universe = u;
    setTheme(u);
    els.uniTitle.textContent = u.emoji + ' ' + u.name;
    els.uniTagline.textContent = u.tagline;

    var start = 0;
    var items = u.stories.map(function (s, i) {
      if (startId && s.id === startId) start = i;
      return {
        scene: s.cover, label: s.title,
        badge: isRead(u, s) ? '✓' : String(s.pages.length) + ' p.'
      };
    });

    els.cfDots.innerHTML = '';
    items.forEach(function () { els.cfDots.appendChild(document.createElement('i')); });

    flow.setItems(items, start);
    requestAnimationFrame(function () { flow.layout(); });
  }

  function renderMeta(i) {
    var u = state.universe;
    if (!u || i < 0) return;
    var s = u.stories[i];
    els.cfTitle.textContent = s.title;
    els.cfSub.textContent = s.subtitle;
    els.cfTags.innerHTML =
      '<span>' + s.tag + '</span><span>' + s.pages.length + ' pages</span>' +
      '<span>≈ ' + s.minutes + ' min</span>' + (isRead(u, s) ? '<span>✓ déjà lue</span>' : '');
    var dots = els.cfDots.children;
    for (var k = 0; k < dots.length; k++) dots[k].className = k === i ? 'on' : '';
    els.read.onclick = function () { location.hash = '#/u/' + u.id + '/' + s.id; };
  }

  /* ============================================================
     LECTEUR DE BD
     ============================================================ */
  function openReader(u, s) {
    state.universe = u; state.story = s;
    setTheme(u);
    els.rTitle.textContent = s.title;
    els.pages.innerHTML = '';

    s.pages.forEach(function (p, i) {
      var a = document.createElement('article');
      a.className = 'page';
      a.innerHTML =
        '<div class="panel">' + Art.scene(p.scene) + '</div>' +
        '<p class="ptext">' + p.text + '</p>' +
        '<div class="pnum">' + (i + 1) + ' / ' + s.pages.length + '</div>';
      els.pages.appendChild(a);
    });

    // page finale
    var end = document.createElement('article');
    end.className = 'page page-end';
    end.innerHTML =
      '<div class="end-badge">🌟</div><h4>Fin !</h4>' +
      '<p>Bonne nuit… et à demain pour une nouvelle histoire.</p>' +
      '<div class="end-actions">' +
      '<button class="primary" data-act="again">Relire</button>' +
      '<button data-act="next">Histoire suivante</button>' +
      '<button data-act="close">Retour aux histoires</button></div>';
    els.pages.appendChild(end);

    end.addEventListener('click', function (e) {
      var act = e.target.getAttribute && e.target.getAttribute('data-act');
      if (act === 'again') goPage(0);
      else if (act === 'close') location.hash = '#/u/' + u.id;
      else if (act === 'next') {
        var i = u.stories.indexOf(s);
        var nx = u.stories[(i + 1) % u.stories.length];
        location.hash = '#/u/' + u.id + '/' + nx.id;
      }
    });

    els.rDots.innerHTML = '';
    for (var k = 0; k <= s.pages.length; k++) els.rDots.appendChild(document.createElement('i'));

    els.reader.hidden = false;
    document.body.style.overflow = 'hidden';

    var saved = parseInt(store('page.' + u.id + '.' + s.id) || '0', 10);
    if (!(saved > 0 && saved < s.pages.length)) saved = 0;
    requestAnimationFrame(function () { goPage(saved, true); syncPage(); });
  }

  function closeReader() {
    if (els.reader.hidden) return;
    els.reader.hidden = true;
    els.pages.innerHTML = '';
    state.story = null;
    document.body.style.overflow = '';
    stopSpeak();
  }

  function goPage(i, instant) {
    var w = els.pages.clientWidth;
    els.pages.scrollTo({ left: i * w, behavior: instant ? 'auto' : 'smooth' });
  }

  function syncPage() {
    var s = state.story;
    if (!s) return;
    var w = els.pages.clientWidth || 1;
    var i = Math.round(els.pages.scrollLeft / w);
    var total = s.pages.length;
    if (i === state.page) return;
    state.page = i;

    var dots = els.rDots.children;
    for (var k = 0; k < dots.length; k++) dots[k].className = k === i ? 'on' : '';
    els.rPrev.disabled = i <= 0;
    els.rNext.disabled = i >= total;

    if (i < total) store('page.' + state.universe.id + '.' + s.id, String(i));
    if (i >= total - 1) store('read.' + state.universe.id + '.' + s.id, '1');

    stopSpeak();
    if (state.speak && i < total) speak(s.pages[i].text);

  els.rClose.onclick = function () { location.hash = '#/u/' + state.universe.id; };

  /* ---------------- lecture à voix haute ---------------- */
  function speak(text) {
    if (!('speechSynthesis' in window)) return;

    if (state.speak && state.story && state.page < state.story.pages.length) {
      speak(state.story.pages[state.page].text);

  /* ============================================================

  function route() {

    else if (storyId) {
      var idx = u.stories.indexOf(findStory(u, storyId));
      if (idx >= 0 && flow.current() !== idx) flow.go(idx);
    } else {
      // retour depuis le lecteur : on rafraîchit les pastilles « déjà lue »
      u.stories.forEach(function (s, i) {
        flow.setBadge(i, isRead(u, s) ? '✓' : s.pages.length + ' p.');
      });
      renderMeta(flow.current());
    }

    if (storyId) {
      var s = findStory(u, storyId);
      if (!s) { location.hash = '#/u/' + u.id; return; }
      state.page = -1;
      openReader(u, s);
    } else {
      closeReader();
      window.scrollTo(0, 0);
    }
  }

  els.back.onclick = function () {
    if (!els.reader.hidden) location.hash = '#/u/' + state.universe.id;
    else location.hash = '#/';
  };

  els.random.onclick = function () {
    var pool = [];
    UNIVERSES.forEach(function (u) {
      u.stories.forEach(function (s) { pool.push([u.id, s.id]); });
    });
    var p = pool[Math.floor(Math.random() * pool.length)];
    location.hash = '#/u/' + p[0] + '/' + p[1];
  };

  window.addEventListener('hashchange', route);
  route();
})();

</script>
